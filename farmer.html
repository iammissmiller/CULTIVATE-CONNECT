<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cultivate Connect - Farmer Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
/* Cultivate Connect - Enhanced Dashboard CSS */
/* Inspired by modern agricultural marketplace design */

:root {
  /* UI Colors */
  --bg-primary: #f9f9f9;
  --bg-white: #ffffff;
  --bg-light: #f5f5f5;
  --text-primary: #333333;
  --text-secondary: #666666;
  --text-light: #999999;
  
  /* Status Colors */
  --success: #4caf50;
  --warning: #ffc107;
  --danger: #f44336;
  --info: #2196f3;
  
  /* Border & Shadow */
  --border-light: #e0e0e0;
  --border-medium: #bdbdbd;
  --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.08);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.1);
  --shadow-lg: 0 6px 20px rgba(0, 0, 0, 0.12);
  
  /* Spacing */
  --border-radius: 12px;
  --border-radius-sm: 8px;
  --border-radius-lg: 16px;
  --transition: all 0.3s ease;
}

/* Reset & Base */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  color: var(--text-primary);
  line-height: 1.6;
}

/* Dashboard Container */
.dashboard-container {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Header */
.dashboard-header {
  background-color: white;
  padding: 15px 30px;
  box-shadow: var(--shadow-sm);
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 100;
}

.header-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 24px;
  font-weight: 600;
}

.header-title i,
.header-title::before {
  color: var(--primary-green);
  font-size: 28px;
}

/* Navigation */
.nav-bar {
  display: flex;
  gap: 25px;
  list-style: none;
}

.nav-bar a {
  text-decoration: none;
  color: var(--text-primary);
  font-weight: 500;
  padding: 8px 16px;
  border-radius: var(--border-radius-sm);
  transition: var(--transition);
}

.nav-bar a:hover,
.nav-bar a.active {
  color: var(--primary-green);
  background-color: rgba(76, 175, 80, 0.1);
}

/* User Info */
.user-info {
  display: flex;
  align-items: center;
  gap: 15px;
}

.user-avatar {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  background-color: var(--primary-green);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: bold;
  font-size: 16px;
}

/* Role Badge */
.role-badge {
  padding: 4px 12px;
  border-radius: var(--border-radius-sm);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
/* Main Content */
.dashboard-main {
  flex: 1;
  padding: 25px;
}

/* Hero/Intro Section */
/* Hero/Intro Section */
.intro-section {
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  color: white;
  padding: 80px 30px;
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-md);
  margin-bottom: 25px;
  text-align: center;
  position: relative;
  overflow: hidden;
}
.intro-section::before {
  content: "";
  position: absolute;
  inset: 0;

  z-index: 1;
}
.intro-section h2,
.intro-section p {
  position: relative;
  z-index: 2;
}

.intro-section h2 {
  font-size: 42px;
  margin-bottom: 15px;
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
  font-weight: 700;
}

.intro-section p,
.intro-description {
  font-size: 20px;
  opacity: 0.95;
  max-width: 700px;
  margin: 0 auto;
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.2);
  line-height: 1.6;
}
/* Tools Panel / SubPage Icons Section */
.subpage-section {
  border-radius: var(--border-radius-lg);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  margin-bottom: 25px;
}

.tools-panel-header,
.section-header {
  padding: 18px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.tools-panel-header h2,
.section-header h3 {
  font-size: 20px;
  font-weight: 700;
  color: var(--primary-dark);
  display: flex;
  align-items: center;
  gap: 10px;
}

.tools-panel-header span,
.section-header span {
  font-size: 14px;
  color: var(--text-secondary);
}

/* Card Grid */
.card-grid,
.tools-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 15px;
  padding: 20px 24px;
}

/* Dashboard Cards / Tool Cards */
.dashboard-card,
.tool-card {
  border-radius: var(--border-radius);
  padding: 20px 16px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  transition: var(--transition);
  position: relative;
}

.dashboard-card:hover,
.tool-card:hover {
  transform: translateY(-5px);
  border-color: rgba(46, 125, 50, 0.4);
  box-shadow: var(--shadow-md);
}

.dashboard-card.active,
.tool-card.active {
  color: white;
  border-color: transparent;
  box-shadow: var(--shadow-lg);
}

/* Card Icons */
.card-icon,
.tool-card i,
.dashboard-card i {
  font-size: 32px;
  padding: 14px;
  border-radius: var(--border-radius);
  background-color: rgba(46, 125, 50, 0.12);
  transition: var(--transition);
}

.dashboard-card.active i,
.tool-card.active i {
  background-color: rgba(255, 255, 255, 0.25);
  color: white;
}

/* Card Title */
.card-title,
.tool-card span,
.dashboard-card span {
  font-size: 15px;
  font-weight: 600;
  text-align: center;
  color: var(--text-primary);
}

.dashboard-card.active span,
.tool-card.active span {
  color: white;
}

.card-content {
  font-size: 14px;
  color: var(--text-secondary);
  text-align: center;
  margin-top: 10px;
}

/* Alerts & Notifications Section */
.alerts-section,
.notifications-section {
  background-color: white;
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

.alerts-header {
  padding: 18px 20px;
  background-color: var(--primary-green);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.alerts-header h3 {
  font-size: 18px;
  display: flex;
  align-items: center;
  gap: 10px;
}

.alerts-body,
.section-body {
  padding: 20px;
}

/* Notification Items */
.notifications-list {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.notification-item,
.alert-item {
  padding: 16px;
  border-radius: var(--border-radius-sm);
  background-color: var(--bg-light);
  display: flex;
  gap: 15px;
  align-items: flex-start;
  transition: var(--transition);
}

.notification-item:hover,
.alert-item:hover {
  background-color: #e8f5e9;
  box-shadow: var(--shadow-sm);
}

.notification-icon,
.alert-icon {
  width: 40px;
  height: 40px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  flex-shrink: 0;
}

.notification-icon.info,
.alert-icon.info { background-color: var(--info); }

.notification-content h4,
.alert-content h4 {
  font-size: 15px;
  margin-bottom: 5px;
  color: var(--text-primary);
}

.notification-content p,
.alert-content p {
  font-size: 14px;
  color: var(--text-secondary);
  line-height: 1.5;
}

.notification-time,
.alert-time {
  font-size: 12px;
  color: var(--text-light);
  margin-top: 5px;
}

/* Stats Cards */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 20px;
  margin-bottom: 25px;
}

.stat-card {
  background: white;
  padding: 20px;
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-sm);
  text-align: center;
  transition: var(--transition);
}

.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-md);
}

.stat-value {
  font-size: 32px;
  font-weight: 700;
  color: var(--primary-green);
  display: block;
  margin-bottom: 8px;
}

.stat-label {
  font-size: 14px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

/* Buttons */
.btn {
  padding: 10px 20px;
  border: none;
  border-radius: var(--border-radius-sm);
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 8px;
}
/* Footer */
.dashboard-footer {
  border-top: 1.4px solid var(--border-light);
  padding: 10px 12px;     /* Much smaller padding */
  text-align: center;
  font-size: 13px;        /* Slightly smaller text */
  margin-top: auto;
  background: #ffffff;     /* clean minimal */
  box-shadow: none;        /* remove heavy shadow */
}


.footer-text {
  font-size: 16px;
  color: var(--text-secondary);
  font-weight: 500;
}

.footer-text strong {
  color: var(--primary-green);
  font-weight: 700;
}

/* Content Rows */
.content-row {
  display: flex;
  gap: 25px;
  margin-bottom: 25px;
}

.content-row > * {
  flex: 1;
}

/* Section Card */
.section-card {
  background-color: white;
  border-radius: var(--border-radius);
  box-shadow: var(--shadow-md);
  overflow: hidden;
}

/* Realtime Indicator */
.realtime-indicator {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
}

.realtime-indicator::before {
  content: '';
  width: 8px;
  height: 8px;
  background: var(--success);
  border-radius: 50%;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(0.9); }
}

/* Loading State */
.loading {
  display: inline-block;
  width: 20px;
  height: 20px;
  border: 3px solid rgba(46, 125, 50, 0.3);
  border-radius: 50%;
  border-top-color: var(--primary-green);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* Fade In Animation */
@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.dashboard-card,
.tool-card,
.intro-section,
.stat-card,
.section-card {
  animation: fadeIn 0.5s ease-out;
}

/* Responsive Design */
@media (max-width: 992px) {
  .content-row {
    flex-direction: column;
  }
  
  .card-grid,
  .tools-grid {
    grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  }
}

@media (max-width: 768px) {
  .dashboard-header {
    flex-direction: column;
    gap: 15px;
    padding: 15px 20px;
  }

  .nav-bar {
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
  }

  .nav-bar a {
    padding: 6px 12px;
    font-size: 14px;
  }

  .header-title {
    font-size: 20px;
  }

  .dashboard-main {
    padding: 18px;
  }

.intro-section {
    padding: 60px 20px;
  }

  .intro-section h2 {
    font-size: 32px;
  }

  .intro-description {
    font-size: 18px;
  }

  .card-grid,
  .tools-grid {
    grid-template-columns: repeat(auto-fit, minmax(110px, 1fr));
    gap: 12px;
    padding: 15px;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .stat-value {
    font-size: 24px;
  }
}

@media (max-width: 480px) {
  .header-title {
    font-size: 18px;
  }

  .user-info {
    font-size: 14px;
  }

  .stats-grid {
    grid-template-columns: 1fr;
  }

  .card-grid,
  .tools-grid {
    grid-template-columns: repeat(2, 1fr);
  }
}

/* Utility Classes */
.text-center { text-align: center; }
.text-left { text-align: left; }
.text-right { text-align: right; }
.mt-1 { margin-top: 1rem; }
.mt-2 { margin-top: 2rem; }
.mb-1 { margin-bottom: 1rem; }
.mb-2 { margin-bottom: 2rem; }
.p-1 { padding: 1rem; }
.p-2 { padding: 2rem; }
.gap-1 { gap: 1rem; }
.gap-2 { gap: 2rem; }

/* --- Farmer Theme --- */

/* =========================================================
   FARMER THEME — Cultivate Connect

/* ---------------------------------------------------------

body[data-dashboard="farmer"] .intro-section {

/* Dark overlay for readability */
body[data-dashboard="farmer"] .intro-section::before {

body[data-dashboard="farmer"] .header-title,

body[data-dashboard="farmer"] .dashboard-card,

body[data-dashboard="farmer"] .tool-card i {

/* ---------------------------------------------------------

body[data-dashboard="farmer"] .btn-primary {

body[data-dashboard="farmer"] .btn-primary:hover {

body[data-dashboard="farmer"] .btn-outline {

body[data-dashboard="farmer"] input,

/* ---------------------------------------------------------
   9. Image Cards / Item Cards

body[data-dashboard="farmer"] .item-card img,

}

   --------------------------------------------------------- */

  transition: 0.2s ease;
  color: var(--farmer-primary);
}

}

/* ---------------------------------------------------------

body[data-dashboard="farmer"] ::-webkit-scrollbar {

}

/* ---------------------------------------------------------
   12. Footer Theme
   --------------------------------------------------------- */
body[data-dashboard="farmer"] .dashboard-footer {

<script>

if (!activeUser || activeUser.role !== "farmer") {

}

// Load farmer's personal data
const farmerDataKey = `cc_user_data_${activeUser.username}`;
const farmerData = JSON.parse(localStorage.getItem(farmerDataKey));

// fallback protection
if (!farmerData) {

}


console.log('Dashboard data loaded:', window.dashboardData);

/**

 * This version prepares for real HTML subpages and removes

 */

console.log("📌 Farmer Dashboard Script Loaded (NON-SPA Mode)");

// --------------------------------------
// MAIN INITIALIZATION
// --------------------------------------
function initFarmerDashboard() {
  console.log("Initializing Farmer Dashboard...");

  const root = document.getElementById("dashboard-root");
  if (!root) return console.error("❌ dashboard-root not found!");

  // Load logged-in user
  const activeUser = JSON.parse(localStorage.getItem("cc_active_user"));
  
  if (!activeUser || activeUser.role !== "farmer") {
      alert("Unauthorized access");
      window.location.href = "login.html";
      return;
  }

  // Load farmer data from local storage
  const farmerDataKey = `cc_user_data_${activeUser.username}`;
  const farmerData = JSON.parse(localStorage.getItem(farmerDataKey));

  // REAL USER OBJECT → use this instead of dashboardData mock
  const user = {
    displayName: activeUser.username,
    username: activeUser.username,
    role: "farmer",
  };

  renderStaticFarmerDashboard(root, user);
  attachFarmerEvents();

  console.log("✅ Farmer Dashboard Ready (Static / Multi-Page Mode)");
}

// --------------------------------------

        ${toolCard("Govt_scheme.html", "fas fa-file-invoice-dollar", "Govt Schemes")}
        ${toolCard("farmer-update.html", "fas fa-bullhorn", "Update Farm")}
        ${toolCard("nearbyshop.html", "fas fa-store", "Nearby Shops")}
      </div>

      <!-- CONTENT ROW WITH ALERTS AND FARMING TIPS -->
      <div class="content-row">
        <!-- ALERTS SECTION -->
        <div class="alerts-section">
          <div class="alerts-header">
            <h3><i class="fas fa-bell"></i> Alerts & Notifications</h3>
          </div>
          <div class="alerts-body">
            <div class="notifications-list">
              ${alertItem("warning", "Weather Alert", "Heavy rains expected in 48 hours.", "2 hours ago")}
              ${alertItem("info", "Irrigation Reminder", "Your wheat crop needs watering.", "5 hours ago")}
              ${alertItem("success", "Order Fulfilled", "Your tomato order is delivered.", "1 day ago")}
            </div>
          </div>
        </div>

        <!-- FARMING TIPS SECTION -->
        <div class="farming-tips-section">
          <div class="tips-header">
            <h3><i class="fas fa-lightbulb"></i> Farming Tips</h3>
          </div>
          <div class="tips-body">
            <div class="tips-list">
              ${tipItem("🌱", "General Farming Tips", "Use soil testing every 6 months for correct fertilizer use. Keep 30% of field area for crop rotation to maintain soil health.")}
              ${tipItem("💧", "Irrigation Tips", "Water crops early morning or late evening to reduce evaporation loss. Use drip irrigation for tomatoes, onions, sugarcane, and vegetables.")}
              ${tipItem("🌤️", "Weather-Based Tips", "Delay sowing if heavy rainfall is expected in the next 48 hours. During heatwaves, irrigate in the evening and avoid fertilizer sprays.")}
              ${tipItem("🐛", "Pest Management Tips", "Use yellow sticky traps for pests like aphids and whiteflies. Practice field sanitation: remove infected leaves immediately.")}
            </div>
          </div>
        </div>
      </div>

    </main>

    <footer class="dashboard-footer">
      <p>© 2025 Cultivate Connect — Where Technology Meets the Fields</p>
    </footer>
  `;
}

// --------------------------------------
// UI BUILDERS
// --------------------------------------
function toolCard(link, iconClass, label) {
  return `
    <a href="${link}" class="tool-card disabled-link">
      <i class="${iconClass}"></i>
      <span>${label}</span>
    </a>
  `;
}

function statCard(value, label) {
  return `
    <div class="stat-card">
      <span class="stat-value">${value}</span>
      <span class="stat-label">${label}</span>
    </div>
  `;
}

function alertItem(type, title, text, time) {
  const icons = {
    warning: "fa-exclamation-triangle",
    info: "fa-info-circle",
    success: "fa-check-circle"
  };

  return `
    <div class="notification-item ${type}">
      <div class="notification-icon ${type}">
        <i class="fas ${icons[type]}"></i>
      </div>
      <div class="notification-content">
        <h4>${title}</h4>
        <p>${text}</p>
        <div class="notification-time">${time}</div>
      </div>
    </div>
  `;
}

function tipItem(emoji, title, text) {
  return `
    <div class="tip-item">
      <div class="tip-icon">${emoji}</div>
      <div class="tip-content">
        <h4>${title}</h4>
        <p>${text}</p>
      </div>
    </div>
  `;
}

// --------------------------------------
// EVENTS (Navigation prepared for real pages)
// --------------------------------------
function attachFarmerEvents() {

  // Navigation active state only
  document.querySelectorAll(".nav-bar a").forEach(link => {
    link.addEventListener("click", () => {
      document.querySelectorAll(".nav-bar a").forEach(a => a.classList.remove("active"));
      link.classList.add("active");
    });
  });
}

// --------------------------------------
// Helper
// --------------------------------------
function getInitials(name) {
  return name.split(" ").map(w => w[0]).join("").toUpperCase();
}

// --------------------------------------
// AUTO INIT
// --------------------------------------
document.addEventListener("DOMContentLoaded", initFarmerDashboard);

</script>
</body>
</html>
